version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: multipost-pg
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: multipost
      POSTGRES_PASSWORD: multipost123
      POSTGRES_DB: multipost
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: multipost-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
